---
name: Rclone Backup
version: 1.2.3
slug: rclone_backup
description: Automatically sync backup to remote locations using rclone
arch:
  - amd64
init: false
url: https://github.com/dig12345/hassio-rclone-scripts
homeassistant_api: true
ingress: true
ingress_port: 9898
panel_icon: mdi:backup-restore
map:
  - addons:rw
  - all_addon_configs:rw
  - backup:rw
  - homeassistant_config:rw
  - media:rw
  - share:rw
  - ssl:ro
options:
  jobs:
    - name: Sync Daily Backups
      schedule: 10 4 * * *
      command: sync
      sources:
        - "/backup"
      destination: google:/Backup/Home Assistant
      include: []
      exclude: []
      flags: {}
      # Example: run arbitrary command on a schedule (uncomment to use)
      # - name: Custom script
      #   schedule: "0 5 * * *"
      #   run: "/config/scripts/backup-custom.sh"
  dry_run: true
  config_path: "/homeassistant/rclone_backup/rclone.conf"
  disable_backrest: false
  backrest_data_path: "/homeassistant/rclone_backup/backrest"
schema:
  jobs:
    - name: str?
      schedule: str?
      command: str?
      run: str?
      source: str?
      sources:
        - str?
      destination: str?
      destinations:
        - str?
      include:
        - str?
      exclude:
        - str?
      flags: "match({(('[^ ]+': *?('([^']|(?<=\\\\)')*'|None|False|True))(, *?'[^ ]+': *?('([^']|(?<=\\\\)')*'|None|False|True))*)?})?"
      extra_flags:
        - str?
  dry_run: bool?
  flags: "match({(('[^ ]+': *?('([^']|(?<=\\\\)')*'|None|False|True))(, *?'[^ ]+': *?('([^']|(?<=\\\\)')*'|None|False|True))*)?})?"
  extra_flags:
    - str?
  run_once: bool?
  config_path: str?
  disable_backrest: bool?
  backrest_data_path: str?
  rclone_config: str?
  no_rename: bool?
  no_unrename: bool?
  no_slugify: bool?
  log_level: list(debug|info|warning|error|fatal)?
image: ghcr.io/dig12345/hassio-rclone-scripts/{arch}
ports:
  8098/tcp: 8098
devices:
  - /dev/fuse
privileged:
  - SYS_ADMIN
apparmor: false
